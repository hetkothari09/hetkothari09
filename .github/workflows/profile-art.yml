name: Profile art

# Regenerates the 3D contribution calendar and the contribution snake.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-art.yml", "assets/stats.py"]

permissions:
  contents: write

jobs:
  contrib-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Draw the stats card
        run: python assets/stats.py ${{ github.repository_owner }} assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the calendar and stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib assets/stats.svg
          git diff --cached --quiet || git commit -m "chore: refresh 3D contribution calendar and stats"
          git pull --rebase
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#8B5CF6&color_dots=#ebedf0,#c7d2fe,#a5b4fc,#818cf8,#6366f1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161b22,#2e1065,#5b21b6,#7c3aed,#a78bfa
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
